<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>RockWave</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        .logo {
            width: 500px;
            max-width: 90%;
            height: auto;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }

        .videos {
            margin-top: 80px;
        }

        .videos h2 {
            font-size: 32px;
            margin-bottom: 30px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1100px;
            margin: auto;
        }

        .video iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            border-radius: 12px;
        }

        @media (max-width: 800px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <img src="rockwave-logo.png" alt="RockWave" class="logo">

    <p>Bem-vindo ao site de rock</p>

    <button onclick="alert('NU METAL, HEAVY METAL')">
        ESTILOS DE ROCK
    </button>

    <section class="videos">
        <h2>🎥 VIDEO CLIPE</h2>

        <div class="video-grid">

            <div class="video">
                <iframe
                    src="https://www.youtube.com/embed/eVTXPUF4Oz4?si=18kTDh1xmHGpb3ZO"
                    title="YouTube video player"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
            </div>

            <div class="video">
                <iframe
                    src="https://www.youtube.com/embed/v2AC41dglnM?si=H2J_8lGKxXRURmH_"
                    title="YouTube video player"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
            </div>

            <div class="video">
                <iframe
                    src="https://www.youtube.com/embed/CSvFpBOe8eY?si=b3Ew1xrMTXqG2AN0"
                    title="YouTube video player"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
            </div>

            <div class="video">
                <iframe
                    src="https://www.youtube.com/embed/5abamRO41fE?si=EOX_EJFkNCkDA5ML"
                    title="YouTube video player"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
            </div>
            
            <div class="video">
                 <iframe
                     src="https://www.youtube.com/embed/iywaBOMvYLI?si=WYV_SduiPvMqM9Mz"
                     title="YouTube video player"
                     allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                     referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
                     </iframe>
                 </div>
        
        </div>
    </section>

</body>
</html>
